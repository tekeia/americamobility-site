<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>America Mobility — How can we help?</title>
<meta name="description" content="America Mobility LLC — vehicle export and immigration services from Florida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#14171f; --muted:#6b7180; --line:#e4e6eb; --soft:#f6f6f4;
    --blue:#1d4ed8; --blue-2:#1e40af; --gold:#b8913a; --gold-2:#9c7a2e; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Manrope",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--gold-2)}
  .topbar{border-bottom:1px solid var(--line)}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 24px;max-width:1000px;margin:0 auto}
  .brand{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;text-transform:uppercase;
    line-height:.95;letter-spacing:.14em;color:#111;text-decoration:none;display:inline-block}
  .brand span{display:block;font-size:clamp(2rem,6vw,3rem)}
  .brand span+span{margin-top:4px}
  .lang{display:flex;gap:4px}
  .lang button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:.78rem;font-weight:600;letter-spacing:.05em}
  .lang button.active{border-color:var(--ink);background:var(--ink);color:#fff}
  main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:80px 16px 80px;text-align:center}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.1;letter-spacing:-.01em;margin-bottom:14px}
  .sub{color:var(--muted);font-size:1.05rem;line-height:1.6;margin-bottom:40px}
  form{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:7px;
    box-shadow:0 6px 24px rgba(20,23,31,.06);transition:border-color .2s,box-shadow .2s}
  form:focus-within{border-color:var(--blue);box-shadow:0 6px 28px rgba(29,78,216,.15)}
  input[type=search]{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:1.05rem;padding:12px 14px}
  input::placeholder{color:#a3a8b3}
  form button{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:0 24px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
  form button:hover{background:var(--blue-2)}
  .email-row{margin-top:22px}
  .email-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ink);color:var(--ink);
    padding:12px 22px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;
    transition:background .2s,color .2s,border-color .2s,transform .2s,box-shadow .2s}
  .email-btn:hover{background:var(--blue);border-color:var(--blue);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(29,78,216,.25)}
  .email-btn:active{transform:translateY(0);box-shadow:none}
  .email-note{display:block;margin-top:10px;font-style:italic;color:var(--muted);font-size:.9rem}
  #results{margin-top:40px;display:grid;gap:12px;text-align:left}
  .card{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);padding:22px;animation:in .25s ease}
  .card h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.45rem;margin-bottom:6px;color:var(--ink)}
  .card p{color:var(--muted);line-height:1.6;margin-bottom:14px}
  .card .cta{display:inline-block;background:var(--blue);color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem}
  .card .cta:hover{background:var(--blue-2)}
  .card.empty{text-align:center}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  footer{text-align:center;color:#9aa0ab;font-size:.8rem;padding:24px 16px;border-top:1px solid var(--line)}
  @media (max-width:480px){form button{padding:0 16px} main{padding-top:56px}}
</style>
</head>
<body>
<div class="topbar">
<header>
  <a class="brand" href="/" aria-label="America Mobility"><span>America</span><span>Mobility</span></a>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="pt">PT</button><button data-lang="es">ES</button>
  </div>
</header>
</div>

<main>
  <h1 data-i18n="title">What brings you to this website?</h1>
  <p class="sub" data-i18n="sub">Tell us what you're looking for and we'll point you in the right direction.</p>

  <form id="search" role="search" autocomplete="off">
    <input id="q" type="search" maxlength="200" data-i18n-ph="ph" placeholder="What are you looking for?" aria-label="Search">
    <button type="submit" data-i18n="go">Search</button>
  </form>

  <div class="email-row">
    <a class="email-btn" id="emailBtn" href="mailto:info@americamobility.com">✉ <span data-i18n="email">Send us an email</span></a>
    <span class="email-note">info@americamobility.com</span>
  </div>

  <section id="results" aria-live="polite"></section>
</main>

<footer>© <span id="yr"></span> America Mobility LLC · Florida</footer>

<script>
/* ============ CONFIG ============ */
// Paste your Google Apps Script web app URL here (see README).
const LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbyjaji97amiHHkyBFh3rDrE23idiMJ-8iMVGK_4UiSZYWWSXFzNf89rL6w0c8aGZShm/exec";
const CONTACT_EMAIL = "info@americamobility.com";
const WHATSAPP = "";  // e.g. "13055551234" (digits only) — leave empty to hide

/* ============ CONTENT ============ */
// Each intent: keywords in EN/PT/ES used for matching, and a result card.
const INTENTS = [
  { id:"export", kw:["export","ship","shipping","paraguay","car","vehicle","truck","auto","buy car","exportar","carro","veiculo","veículo","envio","comprar carro","coche","vehiculo","vehículo","camioneta","enviar","auction","copart","iaai","corvette"],
    t:{en:["Vehicle export","We source and buy US vehicles on your behalf — inspections, title, and coordination through export."],
       pt:["Exportação de veículos","Encontramos e compramos veículos nos EUA para você — inspeção, título e coordenação até a exportação."],
       es:["Exportación de vehículos","Buscamos y compramos vehículos en EE.UU. por usted — inspección, título y coordinación hasta la exportación."]}},
  { id:"immigration", kw:["visa","green card","immigration","eb1","eb-1","eb2","eb-2","niw","h1b","h-1b","o1","o-1","petition","imigração","imigracao","visto","greencard","inmigración","inmigracion","residencia","work permit","uscis"],
    t:{en:["Immigration services","Support for professionals pursuing EB-1, EB-2 NIW and related pathways — flat fee, paid on success."],
       pt:["Serviços de imigração","Apoio a profissionais buscando EB-1, EB-2 NIW e caminhos relacionados — taxa fixa, paga no sucesso."],
       es:["Servicios de inmigración","Apoyo para profesionales que buscan EB-1, EB-2 NIW y vías relacionadas — tarifa fija, pagada al éxito."]}},
  { id:"quote", kw:["price","cost","quote","how much","fee","pricing","preço","preco","quanto","orçamento","orcamento","precio","cuánto","cuanto","cotización","cotizacion"],
    t:{en:["Get a quote","Tell us what you need and we'll reply with pricing and timeline."],
       pt:["Pedir orçamento","Conte o que precisa e responderemos com preço e prazo."],
       es:["Pedir cotización","Cuéntenos qué necesita y le responderemos con precio y plazo."]}},
  { id:"status", kw:["status","track","tracking","my order","my case","update","where is","rastrear","meu pedido","meu caso","andamento","seguimiento","mi pedido","mi caso"],
    t:{en:["Check on an existing order or case","Already working with us? Reach out and we'll send you an update."],
       pt:["Acompanhar pedido ou caso","Já trabalha conosco? Fale com a gente e enviaremos uma atualização."],
       es:["Consultar pedido o caso","¿Ya trabaja con nosotros? Contáctenos y le enviaremos una actualización."]}},
  { id:"jobs", kw:["job","jobs","work","hiring","career","partner","emprego","trabalho","vaga","parceria","trabajo","empleo","socio"],
    t:{en:["Jobs & partnerships","Interested in working with us or partnering? Send us a note."],
       pt:["Vagas e parcerias","Quer trabalhar ou fazer parceria conosco? Mande uma mensagem."],
       es:["Empleo y alianzas","¿Le interesa trabajar o asociarse con nosotros? Escríbanos."]}},
];

const I18N = {
  en:{title:'What brings you to this website?',sub:"Tell us what you're looking for and we'll point you in the right direction.",
      ph:"What are you looking for?",go:"Search",email:"Send us an email",
      contact:"Contact us",wa:"WhatsApp",noTitle:"We didn't find an exact match",noBody:"No problem — we've noted what you searched. Reach out and we'll help directly."},
  pt:{title:'O que te traz a este site?',sub:"Conte o que procura e nós te indicamos o caminho certo.",
      ph:"O que você procura?",go:"Buscar",email:"Envie um e-mail",
      contact:"Fale conosco",wa:"WhatsApp",noTitle:"Não encontramos uma correspondência exata",noBody:"Sem problema — anotamos sua busca. Fale com a gente e ajudamos diretamente."},
  es:{title:'¿Qué le trae a este sitio web?',sub:"Díganos qué busca y le indicaremos el camino correcto.",
      ph:"¿Qué está buscando?",go:"Buscar",email:"Envíenos un correo",
      contact:"Contáctenos",wa:"WhatsApp",noTitle:"No encontramos una coincidencia exacta",noBody:"No hay problema — anotamos su búsqueda. Contáctenos y le ayudamos directamente."}
};

/* ============ TRACKING ============ */
const params = new URLSearchParams(location.search);
const session = (() => { try { let s = sessionStorage.getItem("am_sid"); if(!s){ s = Math.random().toString(36).slice(2,10); sessionStorage.setItem("am_sid", s);} return s; } catch { return "nosession"; } })();
let lastSent = 0;

function track(type, value, extra = {}) {
  if (!LOG_ENDPOINT.startsWith("https://")) { console.log("[track]", type, value, extra); return; }
  const now = Date.now();
  if (now - lastSent < 800) return;          // simple client-side throttle
  lastSent = now;
  const payload = {
    type, value: String(value).slice(0, 200), ...extra,
    lang, session,
    browserLang: navigator.language || "",
    referrer: document.referrer || "(direct)",
    utm_source: params.get("utm_source") || "", utm_medium: params.get("utm_medium") || "", utm_campaign: params.get("utm_campaign") || "",
    path: location.pathname, device: /Mobi|Android/i.test(navigator.userAgent) ? "mobile" : "desktop",
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || ""
  };
  // text/plain + no-cors avoids a CORS preflight, which Apps Script doesn't handle
  fetch(LOG_ENDPOINT, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify(payload), keepalive:true }).catch(()=>{});
}

/* ============ UI ============ */
let lang = (() => { try { return localStorage.getItem("am_lang"); } catch { return null; } })()
  || ({pt:"pt",es:"es"}[(navigator.language||"en").slice(0,2)] || "en");

const $ = s => document.querySelector(s);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

function applyLang() {
  const L = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = L[el.dataset.i18n]);
  $("#q").placeholder = L.ph;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  $("#results").innerHTML = "";
}

function contactLinks(intent, query) {
  const L = I18N[lang];
  const subject = encodeURIComponent(`[America Mobility] ${intent}`);
  const body = encodeURIComponent(query ? `Search: ${query}\n\n` : "");
  let html = `<a class="cta" href="mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}" data-cta="email" data-for="${intent}">${L.contact}</a>`;
  if (WHATSAPP) html += ` <a class="cta" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${body}" data-cta="whatsapp" data-for="${intent}">${L.wa}</a>`;
  return html;
}

function card(intent, query) {
  const [h, p] = intent.t[lang];
  return `<article class="card"><h3>${h}</h3><p>${p}</p>${contactLinks(intent.id, query)}</article>`;
}

function search(raw) {
  const q = norm(raw);
  if (!q) return;
  const scored = INTENTS.map(i => ({ i, score: i.kw.reduce((s, k) => s + (q.includes(norm(k)) ? norm(k).length : 0), 0) }))
                        .filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  const L = I18N[lang];
  $("#results").innerHTML = scored.length
    ? scored.slice(0, 3).map(x => card(x.i, raw)).join("")
    : `<article class="card empty"><h3>${L.noTitle}</h3><p>${L.noBody}</p>${contactLinks("unmatched", raw)}</article>`;
  track("search", raw, { matched: scored.map(x => x.i.id).join(",") || "NONE" });
}

$("#search").addEventListener("submit", e => { e.preventDefault(); search($("#q").value); });

$("#results").addEventListener("click", e => {
  const a = e.target.closest("[data-cta]"); if (a) track("contact_click", a.dataset.for, { channel: a.dataset.cta });
});

document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem("am_lang", lang); } catch {}
  applyLang();
});

// Capture searches people typed but never submitted (left the page mid-thought)
let typedNotSent = "";
$("#q").addEventListener("input", e => typedNotSent = e.target.value);
$("#search").addEventListener("submit", () => typedNotSent = "");
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && typedNotSent.trim().length > 2) { lastSent = 0; track("abandoned_search", typedNotSent); typedNotSent = ""; }
});

// Email button: prefills whatever they typed in the search bar
$("#emailBtn").addEventListener("click", e => {
  const q = $("#q").value.trim();
  const subject = encodeURIComponent("America Mobility — inquiry");
  const body = encodeURIComponent(q ? `Hi, I'm looking for: ${q}\n\n` : "");
  e.currentTarget.href = `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}`;
  lastSent = 0; track("contact_click", q || "email_button", { channel: "email" });
});

$("#yr").textContent = new Date().getFullYear();
applyLang();
track("visit", location.pathname);
</script>
</body>
</html>
